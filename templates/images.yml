# Render this template with an explicit default branch, image coordinate, optional
# provider destinations, and the immutable reusable-workflow revision below.
# Pull requests build without registry credentials or write permissions; publication
# occurs only after merge/push or an explicit workflow dispatch.
name: images

on:
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - "Dockerfile"
      - "Dockerfile.*.dkf"
      - "Containerfile"
      - "src/**"
      - "Cargo.*"
      - "package*.json"
      - "pubspec.*"
      - "go.*"
      - "gleam.toml"
      - "manifest.toml"
  push:
    branches: ["__DEFAULT_BRANCH__"]
    paths:
      - ".github/workflows/images.yml"
      - "Dockerfile"
      - "Dockerfile.*.dkf"
      - "Containerfile"
      - "src/**"
      - "Cargo.*"
      - "package*.json"
      - "pubspec.*"
      - "go.*"
      - "gleam.toml"
      - "manifest.toml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: ORESoftware/ores-gha-workflows/.github/workflows/container-images.yml@d3896ec92f1f16a446b66a5a3a80b9914e33dbe7
    with:
      image-name: "__ORG__/__IMAGE__"
      gcp-project: "__GCP_PROJECT__"
      dockerhub-namespace: "__DOCKERHUB_NS__"
      push: false

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ORESoftware/ores-gha-workflows/.github/workflows/container-images.yml@d3896ec92f1f16a446b66a5a3a80b9914e33dbe7
    with:
      image-name: "__ORG__/__IMAGE__"
      gcp-project: "__GCP_PROJECT__"
      dockerhub-namespace: "__DOCKERHUB_NS__"
      push: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      BUILD_SECRET_GITHUB_TOKEN: ${{ secrets.SHARED_AUTH_READ_TOKEN }}
