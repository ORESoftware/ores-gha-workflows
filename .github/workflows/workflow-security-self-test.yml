name: workflow security self-test

on:
  pull_request:
    paths:
      - 'actions/workflow-security/**'
      - 'tools/workflow_security.rs'
      - '.github/workflows/workflow-security-self-test.yml'
  push:
    branches: [main]
    paths:
      - 'actions/workflow-security/**'
      - 'tools/workflow_security.rs'
      - '.github/workflows/workflow-security-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Exercise local workflow-security action
        uses: ./actions/workflow-security
      - name: Prove validation is read-only
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
