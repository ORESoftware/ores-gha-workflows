name: foundational repository policy

on:
  workflow_call:
    inputs:
      policy_ref:
        description: Full immutable commit SHA in ORESoftware/ores-gha-workflows containing the reviewed policy snapshot.
        required: true
        type: string
      policy_sha256:
        description: Canonical SHA-256 of policy/foundational-policy.json.
        required: true
        type: string
      manifest_paths:
        description: Optional newline-separated repository-relative files to scan instead of the default manifest/workflow set.
        required: false
        type: string
        default: ""
      scan_all_text:
        description: Scan all text-readable files rather than default dependency/workflow manifests.
        required: false
        type: boolean
        default: false
    outputs:
      report:
        description: Compact ores.foundational-policy-report/v1 JSON.
        value: ${{ jobs.validate.outputs.report }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      report: ${{ steps.report.outputs.json }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
          POLICY_SHA256: ${{ inputs.policy_sha256 }}
        run: |
          set -euo pipefail
          [[ "$POLICY_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'policy_ref must be a full 40-hex commit SHA' >&2; exit 2; }
          [[ "$POLICY_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'policy_sha256 must be a full SHA-256' >&2; exit 2; }
      - name: Check out caller exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out immutable policy tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-gha-workflows
          ref: ${{ inputs.policy_ref }}
          path: .ores-policy
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
      - name: Self-test policy engine
        run: node .ores-policy/scripts/foundational-policy-scan.mjs --self-test
      - name: Scan caller policy references
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ inputs.policy_sha256 }}
          MANIFEST_PATHS: ${{ inputs.manifest_paths }}
          SCAN_ALL_TEXT: ${{ inputs.scan_all_text }}
        run: |
          set -euo pipefail
          args=(
            --policy .ores-policy/policy/foundational-policy.json
            --expected-digest "$EXPECTED_DIGEST"
            --root .
            --report foundational-policy-report.json
          )
          if [[ "$SCAN_ALL_TEXT" == "true" ]]; then
            args+=(--all)
          elif [[ -n "$MANIFEST_PATHS" ]]; then
            while IFS= read -r manifest; do
              [[ -z "$manifest" ]] || args+=(--manifest "$manifest")
            done <<< "$MANIFEST_PATHS"
          fi
          node .ores-policy/scripts/foundational-policy-scan.mjs "${args[@]}"
      - name: Emit deterministic report
        id: report
        shell: bash
        run: |
          set -euo pipefail
          compact="$(node -e "const fs=require('fs'); process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync('foundational-policy-report.json','utf8'))))")"
          echo "json=$compact" >> "$GITHUB_OUTPUT"
      - name: Prove caller checkout stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -f foundational-policy-report.json
          test -z "$(git status --porcelain=v1 --untracked-files=all -- . ':(exclude).ores-policy')"
