# Reusable workflow: build per-arch images from Dockerfile.arm64.dkf / Dockerfile.x86-64.dkf
# (falling back to Dockerfile) and push to GHCR, GCP Artifact Registry and a private Docker Hub
# namespace. Called from each repo's .github/workflows/images.yml (see templates/images.yml).
name: container-images
on:
  workflow_call:
    inputs:
      image-name:      { type: string, required: true,  description: "Image name without registry, e.g. apostille-me/apme-api-server" }
      context:         { type: string, required: false, default: "." }
      arm64:           { type: boolean, required: false, default: true }
      amd64:           { type: boolean, required: false, default: true }
      push:            { type: boolean, required: false, default: true }
      gcp-region:      { type: string, required: false, default: "us-central1" }
      gcp-project:     { type: string, required: false, default: "" , description: "GCP project id (1:1 with the GitHub org). Empty = skip Artifact Registry." }
      dockerhub-namespace: { type: string, required: false, default: "", description: "Private Docker Hub org/user. Empty = skip Docker Hub." }
      build-args:      { type: string, required: false, default: "" }
    secrets:
      DOCKERHUB_USERNAME: { required: false }
      DOCKERHUB_TOKEN:    { required: false }
      GCP_WORKLOAD_IDENTITY_PROVIDER: { required: false }
      GCP_SERVICE_ACCOUNT: { required: false }
      BUILD_SECRET_GITHUB_TOKEN: { required: false, description: "Read token for private git deps at build time (mounted as secret id=github_token)" }
    outputs:
      arm64-digest:
        value: ${{ jobs.build.outputs.arm64-digest }}
      amd64-digest:
        value: ${{ jobs.build.outputs.amd64-digest }}
      manifest:
        value: ${{ jobs.manifest.outputs.manifest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          IMAGE: ${{ inputs.image-name }}
          GCP_REGION: ${{ inputs.gcp-region }}
          GCP_PROJECT: ${{ inputs.gcp-project }}
          DH_NS: ${{ inputs.dockerhub-namespace }}
          WANT_ARM64: ${{ inputs.arm64 }}
          WANT_AMD64: ${{ inputs.amd64 }}
        run: |
          set -euo pipefail
          ctx='${{ inputs.context }}'
          pick() { # arch-specific dockerfile, else Dockerfile
            for f in "$ctx/Dockerfile.$1.dkf" "$ctx/Dockerfile"; do [ -f "$f" ] && { echo "$f"; return; }; done; echo ""; }
          items=()
          if [ "$WANT_ARM64" = "true" ]; then f=$(pick arm64); [ -n "$f" ] && items+=("{\"arch\":\"arm64\",\"platform\":\"linux/arm64\",\"file\":\"$f\",\"runner\":\"ubuntu-24.04-arm\"}"); fi
          if [ "$WANT_AMD64" = "true" ]; then f=$(pick x86-64); [ -n "$f" ] && items+=("{\"arch\":\"amd64\",\"platform\":\"linux/amd64\",\"file\":\"$f\",\"runner\":\"ubuntu-latest\"}"); fi
          [ ${#items[@]} -gt 0 ] || { echo "no Dockerfile found under $ctx"; exit 1; }
          printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${items[*]}")" >> "$GITHUB_OUTPUT"
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          tags="ghcr.io/$owner/${IMAGE##*/}"
          [ -n "$GCP_PROJECT" ] && tags="$tags,$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$IMAGE"
          [ -n "$DH_NS" ] && tags="$tags,docker.io/$DH_NS/$(echo "$IMAGE" | tr '/' '-')"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "registries: $tags"; echo "matrix: $(IFS=,; echo "${items[*]}")"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    outputs:
      arm64-digest: ${{ steps.out.outputs.arm64 }}
      amd64-digest: ${{ steps.out.outputs.amd64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Login Docker Hub
        if: inputs.dockerhub-namespace != ''
        uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: GCP auth (OIDC)
        if: inputs.gcp-project != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Login Artifact Registry
        if: inputs.gcp-project != ''
        run: gcloud auth configure-docker ${{ inputs.gcp-region }}-docker.pkg.dev --quiet
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            TARGETARCH=${{ matrix.arch }}
            ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.BUILD_SECRET_GITHUB_TOKEN }}
          # push by digest to every registry; the manifest job creates the multi-arch :branch / :sha-* tags
          outputs: type=image,"name=${{ needs.plan.outputs.tags }}",push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - id: out
        run: echo "${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  manifest:
    needs: [plan, build]
    if: inputs.push
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.m.outputs.manifest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: inputs.dockerhub-namespace != ''
        uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - if: inputs.gcp-project != ''
        uses: google-github-actions/auth@v2
        with: { workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}" }
      - if: inputs.gcp-project != ''
        run: gcloud auth configure-docker ${{ inputs.gcp-region }}-docker.pkg.dev --quiet
      - id: m
        shell: bash
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
          ARM: ${{ needs.build.outputs.arm64-digest }}
          AMD: ${{ needs.build.outputs.amd64-digest }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME//\//-}"; sha="sha-${GITHUB_SHA::12}"
          IFS=, read -ra repos <<< "$TAGS"
          for repo in "${repos[@]}"; do
            srcs=(); [ -n "$ARM" ] && srcs+=("$repo@$ARM"); [ -n "$AMD" ] && srcs+=("$repo@$AMD")
            echo "manifest $repo:{$ref,$sha} <- ${srcs[*]}"
            docker buildx imagetools create -t "$repo:$ref" -t "$repo:$sha" "${srcs[@]}"
          done
          echo "manifest=${repos[0]}:$sha" >> "$GITHUB_OUTPUT"
