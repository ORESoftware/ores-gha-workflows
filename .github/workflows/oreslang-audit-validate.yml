name: oreslang-lifecycle-races

on:
  push:
    branches:
      - "tmp/oreslang-lifecycle-races-*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: mvn -B -ntp verify
      - run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
      - run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
